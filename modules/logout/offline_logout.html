<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - SmartBulletin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 77, 77, 0.15);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 20px;
        }
        
        .icon {
            font-size: 4em;
            color: #ff4d4d;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 2em;
        }
        
        p {
            margin-bottom: 20px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .btn {
            background: #7B0000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            background: #9B1000;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚪</div>
        <h1>Session Ended</h1>
        <p>It looks like your account was signed in on another device. For your security, you were signed out on this device. Please log in again to continue.</p>
        <a href="/SmartBulletin/modules/login/login.php" class="btn">Go to Login</a>
    </div>
    
    <script>
        function retryConnection() {
            // Clear service worker cache and reload
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                    window.location.reload();
                });
            } else {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
