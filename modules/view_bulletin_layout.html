<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bulletin - Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        html, body { 
            height: 100%; 
            background: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        .screen { 
            height: 100%; 
            display: grid; 
            grid-template-columns: 360px 1fr minmax(340px, 26vw); 
            grid-template-rows: auto 1fr auto; 
            gap: 12px; 
            padding: 12px; 
        }
        
        .topbar { 
            grid-column: 1 / -1; 
            background: #ffffff; 
            color: #333; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            padding: 15px 24px; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
            border: 2px solid #7B0000;
        }
        
        .topbar-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
        }
        
        .logos-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        
        .header-logo {
            height: 80px;
            width: auto;
            border-radius: 5px;
            transition: transform 0.3s ease;
        }
        
        .header-logo:hover {
            transform: scale(1.05);
        }
        
        .topbar .logo { 
            font-weight: 700; 
            letter-spacing: 0.5px; 
        }
        
        .topbar .spacer { 
            flex: 1; 
        }
        
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            text-align: right;
            flex-shrink: 0;
        }
        .time-top {
            font-weight: 700;
            font-size: 2em;
            color: #7B0000;
            line-height: 1.1;
        }
        .time-bottom {
            font-weight: 600;
            font-size: 1.4em;
            color: #7B0000;
            opacity: 0.9;
            line-height: 1.1;
            margin-top: 4px;
        }

        .panel { 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); 
            overflow: hidden; 
            border: 1px solid #e0e0e0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        
        .left { 
            display: flex; 
            flex-direction: column; 
            height: 100%;
            min-height: 100%;
            transition: all 0.8s ease-in-out;
        }
        
        .left .section-title { 
            background: #006633; 
            color: #fff; 
            padding: 15px 20px; 
            font-weight: 600; 
            letter-spacing: 0.4px; 
            font-size: 1.2em;
        }
        
        .list { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow: auto; 
        }
        
        .list-item { 
            border: 1px solid #e0e0e0; 
            border-left: 4px solid #7B0000; 
            border-radius: 12px; 
            padding: 15px 18px; 
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .list-item:hover {
            box-shadow: 0 4px 12px rgba(123, 0, 0, 0.1);
            transform: translateY(-2px);
            border-color: rgba(123, 0, 0, 0.3);
        }
        
        .list-item .title { 
            font-weight: 600; 
            font-size: 1.1em; 
            margin-bottom: 8px; 
            color: #7B0000;
        }
        
        .list-item .meta { 
            color: #666; 
            font-size: 0.9em; 
            font-style: italic;
        }

        .center { 
            position: relative; 
            display: flex; 
            align-items: stretch; 
            justify-content: center; 
            transition: all 0.8s ease-in-out;
            height: 100%;
            min-height: 100%;
            background: transparent;
            border: none;
            box-shadow: none;
        }
        
        .center.expanded {
            grid-column: 1 / 3;
            /* transform: translateX(-360px); */
            max-width: calc(100% + 360px);
            height: 100%;
            min-height: 100%;
        }
        
        .hero { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: stretch; 
            justify-content: center; 
            background: #ffffff; 
            border-radius: 0;
            transition: all 0.8s ease-in-out;
        }
        /* Hide scrollbars inside center panel (keep scrolling functional) */
        .hero, .hero * {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;    /* Firefox */
        }
        .hero::-webkit-scrollbar, .hero *::-webkit-scrollbar {
            display: none;            /* Chrome, Safari, Opera */
        }
        /* Hide all scrollbars globally while preserving scroll functionality */
        * {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none;    /* Firefox */
        }
        *::-webkit-scrollbar {
            display: none;            /* Chrome, Safari, Opera */
        }
        
        .hero img, .hero video { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 20px;
            transition: opacity 0.5s ease-in-out;
        }
        
        .hero div {
            transition: opacity 0.5s ease-in-out;
        }

        .right { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto;
            height: 100%;
            min-height: 100%;
        }
        
        .hierarchy-section {
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .hierarchy-section:hover {
            box-shadow: 0 4px 12px rgba(123, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .hierarchy-header {
            background: #006633;
            color: #fff;
            padding: 15px 20px;
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            letter-spacing: 0.3px;
        }
        
        .hierarchy-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .hierarchy-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }
        
        .hierarchy-item:hover {
            background: rgba(123, 0, 0, 0.05);
            border-color: rgba(123, 0, 0, 0.2);
            transform: translateX(5px);
        }
        
        .hierarchy-item img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B0000;
            flex-shrink: 0;
        }
        
        .hierarchy-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .hierarchy-item .name {
            font-weight: 600;
            color: #7B0000;
            font-size: 1em;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .hierarchy-item .position {
            font-size: 0.85em;
            color: #666;
            line-height: 1.3;
        }
        
        .hierarchy-item .specialization {
            font-size: 0.8em;
            color: #7B0000;
            margin-top: 8px;
            font-style: italic;
            font-weight: 500;
            padding: 4px 8px;
            background: rgba(123, 0, 0, 0.1);
            border-radius: 8px;
            border-left: 3px solid #7B0000;
        }
        
        .hierarchy-item .no-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f8f9fa;
            border: 2px solid #7B0000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7B0000;
            font-size: 0.8em;
            text-align: center;
            flex-shrink: 0;
        }

        /* Marquee Styles - Infinite Scroll Approach */
        .marquee-container {
            flex: 1;
            overflow: hidden;
            background: #006633; /* OLFU green */
            color: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            position: relative;
            border: 1px solid #006633; /* OLFU green */
            min-width: 0; /* Allow shrinking */
        }
        
        .marquee-content {
            display: flex;
            white-space: nowrap;
            font-size: 2em;
            font-weight: 700;
            will-change: transform;
            animation-fill-mode: both;
        }
        
        .marquee-content.animate {
            animation: none;
        }
        
        .marquee-content.transitioning {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .marquee-content.loaded {
            opacity: 1;
        }
        
        .marquee-item {
            display: inline-flex;
            align-items: center;
            margin-right: 100px;
            opacity: 0.95;
            flex-shrink: 0;
        }
        
        .marquee-separator {
            color: rgba(255, 255, 255, 0.8);
            margin: 0 20px;
            font-size: 1.2em;
            flex-shrink: 0;
        }
        
        @keyframes scroll-left-infinite {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        
        .marquee-container:hover .marquee-content {
            animation-play-state: paused;
        }
        
        /* Marquee pause indicator */
        .marquee-container:hover::after {
            content: "⏸️ Paused";
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7em;
            pointer-events: none;
        }
        
        /* Marquee transition effects */
        .marquee-content.transitioning {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .marquee-content.loaded {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .screen { 
                grid-template-columns: 300px 1fr minmax(280px, 24vw); 
                gap: 14px;
                padding: 14px;
            }
            
            .logos-section {
                gap: 10px;
            }
            
            .header-logo {
                height: 45px;
            }
        }
        
        @media (max-width: 980px) {
            .screen { 
                grid-template-columns: 1fr; 
                grid-template-rows: auto auto auto 1fr auto; 
                gap: 15px;
            }
            
            .topbar-main {
                gap: 15px;
            }
            
            .marquee-container {
                min-width: 200px;
            }
            
            .left, .center, .right { 
                min-height: 300px; 
            }
            
            .panel {
                border-radius: 15px;
            }
            
            .list {
                padding: 15px;
            }
            
            .right {
                padding: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .screen {
                padding: 10px;
                gap: 10px;
            }
            
            .topbar {
                padding: 12px 15px;
                border-radius: 8px;
            }
            
            .topbar-main {
                flex-direction: column;
                gap: 10px;
            }
            
            .logos-section {
                gap: 10px;
            }
            
            .header-logo {
                height: 36px;
            }
            
            .marquee-container {
                width: 100%;
                order: 2;
            }
            
            .time-block { order: 1; }
            .time-top { font-size: 1.7em; }
            .time-bottom { font-size: 1.1em; }
            
            .panel {
                border-radius: 12px;
            }
            
            .list {
                padding: 12px;
                gap: 10px;
            }
            
            .list-item {
                padding: 12px 15px;
            }
            
            .right {
                padding: 12px;
                gap: 15px;
            }
            
            .marquee-content {
                font-size: 1.6em;
            }
            
            .marquee-item {
                margin-right: 60px;
            }
        }
        
        /* Calendar Styles */
        .calendar-container {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            margin: 10px 0;
            position: relative;
            z-index: 1;
        }

        .calendar-container .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background: #7B0000;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .calendar-container .button {
            padding: 8px 15px;
            background: #7B0000;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .calendar-container .button:hover {
            background: #8B0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 0, 0, 0.3);
        }

        .calendar-container .button.arrow {
            font-size: 15px;
            padding: 8px 20px;
            font-weight: bold;
            display: none;
        }

        .calendar-container .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 4px;
        }

        .calendar-container .calendar-header {
            background: #7B0000;
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
        }

        .calendar-container .calendar-day {
            background: #ffffff;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            height: 160px;
            position: relative;
            overflow: auto;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .calendar-container .calendar-day:hover {
            background: #f8f9fa;
        }

        .calendar-container .day-number {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 16px;
            color: #666;
        }

        .calendar-container .event {
            margin-top: 30px;
            font-size: 16px;
            color: #333;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: left;
            margin-left: 8px;
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            height: auto;
            min-height: 45px;
            overflow: hidden;
            white-space: normal;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        .calendar-container .event.event-type {
            background: rgba(123, 0, 0, 0.1);
            border: 1px solid rgba(123, 0, 0, 0.2);
            color: #7B0000;
            font-weight: 600;
        }

        .calendar-container .event.event-type:hover {
            background: rgba(123, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .calendar-container .event.announcement-type {
            background: rgba(123, 0, 0, 0.1);
            border: 1px solid rgba(123, 0, 0, 0.2);
            color: #7B0000;
        }

        .calendar-container .event.announcement-type:hover {
            background: rgba(123, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .calendar-container .empty {
            background: #f8f9fa;
        }

        .calendar-container .event-details {
            font-size: 12px;
            margin-top: 4px;
            color: #666;
            font-weight: normal;
            display: block;
        }

        .calendar-container .month-label {
            flex-grow: 1;
            text-align: center;
        }

        /* Responsive Calendar Styles */
        @media (max-width: 768px) {
            .calendar-container .calendar {
                display: flex;
                flex-direction: column;
            }

            .calendar-container .calendar-day.empty {
                display: none;
            }

            .calendar-container .calendar-header {
                display: none;
            }

            .calendar-container .calendar-day {
                height: auto;
                min-height: 100px;
                padding: 10px;
                font-size: 14px;
                text-align: left;
                border-radius: 10px;
                margin-bottom: 10px;
            }

            .calendar-container .day-number {
                position: static;
                display: block;
                font-weight: bold;
                margin-bottom: 8px;
                font-size: 16px;
            }

            .calendar-container .event {
                height: auto;
                font-size: 13px;
                margin-top: 8px;
                padding: 6px 10px;
            }

            .calendar-container .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
                font-size: 16px;
            }

            .calendar-container .button {
                font-size: 14px;
                padding: 6px 12px;
            }

            .calendar-container .button.arrow {
                font-size: 20px;
                padding: 6px 12px;
            }

            .calendar-container .month-label {
                flex-grow: 1;
                text-align: center;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="topbar">
            <div class="topbar-main">
                <div class="logos-section">
                    <img src="../images/logoOLFU.png" alt="OLFU Logo" class="header-logo">
                    <img src="../images/logoCCS.png" alt="CCS Logo" class="header-logo">
                    <img src="../images/logoFCMS.png" alt="Main Logo" class="header-logo">
                </div>
                <div class="marquee-container">
                    <div class="marquee-content animate" id="marqueeContent">
                        <div class="marquee-item">Welcome to Smart Bulletin Board - Your Digital Campus Hub!</div>
                    </div>
                </div>
                <div class="time-block">
                    <div class="time-top" id="timeTop">--:-- --</div>
                    <div class="time-bottom" id="timeBottom">---, --- --</div>
                </div>
            </div>
        </div>

        <div class="panel left">
            <div class="section-title">Announcements</div>
            <div id="annList" class="list"></div>
            <div class="section-title">Events</div>
            <div id="evtList" class="list"></div>
        </div>

        <div class="center">
            <div id="hero" class="hero"></div>
        </div>

        <div class="panel right">
            <div id="facultyOfficers" class="right"></div>
        </div>

        <!-- ticker removed -->
    </div>

    <script>
        const API_URL = '../api/get_slides_data.php';
        const MARQUEE_API_URL = '../api/get_marquee_data.php';

        function formatTopTime() {
            const d = new Date();
            const time = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
            const day = d.toLocaleDateString([], { weekday:'short' });
            const date = d.toLocaleDateString([], { month:'short', day:'numeric' });
            const timeEl = document.getElementById('timeTop');
            const dateEl = document.getElementById('timeBottom');
            if (timeEl) timeEl.textContent = time;
            if (dateEl) dateEl.textContent = `${day}, ${date}`;
        }
        setInterval(formatTopTime, 1000); formatTopTime();

        function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#039;'}[m])); }
        function base(path){ return String(path||'').split('/').pop(); }

		// Normalize strings for diacritic-insensitive comparisons (supports ñ/Ñ and others)
		function normalizeForCompare(value){
			try {
				return String(value||'')
					.normalize('NFD')
					.replace(/[\u0300-\u036f]/g, '')
					.toLowerCase();
			} catch(_) {
				// Fallback if normalize not supported
				return String(value||'').toLowerCase();
			}
		}

        let currentSlideIndex = 0;
        let slideInterval;
        let previousSlide = null;
        let hasShownEvent = false;
        let hasShownAnnouncement = false;
        let isReturningToSlideshow = false;

		function renderHero(items){
			// Build slides in strict order: events first (media + text), then announcements (media + text + grouped)
			const eventSlides = items.filter(i => i.type === 'events');
			const groupedAnnouncements = items.filter(i => i.type === 'announcements_group')
				.flatMap(g => g.announcements || [])
				.filter(a => !a.file_path);
			const announcementSingles = items.filter(i => i.type === 'announcements');
			const announcementSlides = [...announcementSingles, ...groupedAnnouncements];
			
			// Add calendar slide before organization charts transition
			const calendarSlide = {
				type: 'calendar',
				title: 'Calendar',
				file_path: null,
				calendarData: getCalendarData()
			};
			
			const allSlides = [...eventSlides, ...announcementSlides, calendarSlide];
            
            // Store original slides for later return and reset gating flags
            originalSlides = allSlides;
            hasShownEvent = false;
            hasShownAnnouncement = false;
            
            // Reset slideshow completion flag to allow new slideshow cycles
            slideshowCompleted = false;
            
			console.log('Slideshow items:', {
				order: 'events_then_announcements',
				events: eventSlides.length,
				announcements: announcementSlides.length,
				groupedAnnouncements: groupedAnnouncements.length,
				total: allSlides.length,
				debug: {
					allEvents: eventSlides.map(e => ({ title: e.title, type: e.type })),
					allAnnouncements: announcementSlides.map(a => ({ title: a.title, type: a.type, user_type: a.user_type })),
					finalSlides: allSlides.map(s => ({ title: s.title, type: s.type }))
				}
			});
            
            if(allSlides.length === 0) {
                console.log('No content available - redirecting to organization chart');
                // Immediately expand to show organization charts when no content is available
                expandCenterPanel();
                return;
            }

            // Start slideshow
            currentSlideIndex = 0;
            showSlide(allSlides, 0);
            startSlideshow(allSlides);
        }

        function showSlide(slides, index) {
            // Prevent hero updates while org charts are active or during return transition
            if (isOrgChartsActive || isReturningToSlideshow) {
                try { console.log('showSlide blocked during transition', { isOrgChartsActive, isReturningToSlideshow }); } catch(e) {}
                return;
            }
            const el = document.getElementById('hero');
            const slide = slides[index];
            
            // Debug: log every slide display
            try {
                console.log('showSlide', { index, total: slides.length, title: slide && slide.title, type: slide && slide.type, hasMedia: slide && !!slide.file_path });
            } catch(e) {}
            
            // Update previous slide in the right panel
            if (previousSlide) {
                updatePreviousSlideDisplay(previousSlide);
            }
            
            // Set current slide as previous for next iteration
            previousSlide = slide;
            
            // Mark category as shown for gating
            if (slide && slide.type === 'events') hasShownEvent = true;

                if (currentSlideIndex === slides.length - 1 && !slideshowCompleted) {
                    const slidesContainEvents = slides.some(s => s.type === 'events');
                    const slidesContainAnnouncements = slides.some(s => s.type === 'announcements' || s.type === 'announcements_group');

                        totalSlides: slides.length,

                        hasShownAnnouncement,

                        slidesContainEvents,
                        slidesContainAnnouncements

                        // Requirements met, stop slideshow and expand
                        clearInterval(slideInterval);
                        slideshowCompleted = true;

        // Helper function to split array into chunks
        function chunkArray(array, chunkSize) {
            const chunks = [];
            for (let i = 0; i < array.length; i += chunkSize) {
                chunks.push(array.slice(i, i + chunkSize));
            }
            
            // If the last chunk has only 1 item, merge it with the previous chunk
            if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) {
                const lastItem = chunks.pop();
                chunks[chunks.length - 1].push(...lastItem);
            }
            
            return chunks;
        }

                .then(response => response.json())
                .then(data => {

                .catch(error => {

                    return '<div style="text-align: center; padding: 20px; color: #7B0000;">Calendar unavailable</div>';

        /**
         * Fisher-Yates shuffle algorithm for randomizing arrays
         * @param {Array} array - The array to shuffle
         * @returns {Array} - Shuffled copy of the array
         */
        function shuffleArray(array) {
            const shuffled = [...array]; // Create a copy
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function returnToOriginalSlideshow() {
            // Enter guarded transition state and stop hero interval to avoid stray ticks
            isReturningToSlideshow = true;
            if (slideInterval) {
                clearInterval(slideInterval);
            }
            // Stop all slideshows
            stopFacultySlideshow();
            stopOfficerSlideshow();
            isOrgChartsActive = false;
            
            // Restore the center panel to normal size
            const centerPanel = document.querySelector('.center');
            centerPanel.classList.remove('expanded');
            
            // Show the left panel again
            const leftPanel = document.querySelector('.left');
            leftPanel.style.opacity = '1';
            leftPanel.style.pointerEvents = 'auto';
            
            // Show the right panel again and remove specializations panel
            const rightPanel = document.querySelector('.panel.right');
            rightPanel.style.opacity = '1';
            rightPanel.style.pointerEvents = 'auto';
            
            // Remove specializations panel if it exists - more aggressive cleanup
            const specializationsPanel = document.getElementById('specializationsPanel');
            if (specializationsPanel) {
                specializationsPanel.remove();
                console.log('Removed specializations panel during return to slideshow');
            }
            
            // Additional cleanup: remove any lingering specializations panels
            const allSpecializationsPanels = document.querySelectorAll('[id^="specializations"]');
            allSpecializationsPanels.forEach(panel => {
                if (panel.id !== 'specializationsPanel') { // Don't remove main panel that may be legitimate
                    panel.remove();
                    console.log('Removed lingering specializations panel:', panel.id);
                }
            });
            
            // Reset the right panel to show previous slide
            const rightContainer = document.getElementById('facultyOfficers');
            renderPreviousSlide(rightContainer);
            
            // Reset slideshow completed flag
            slideshowCompleted = false;

            // Immediately restart the original slideshow without waiting on network
            if (Array.isArray(originalSlides) && originalSlides.length > 0) {
                currentSlideIndex = 0;
                if (originalSlides.length > 1) {
                    previousSlide = originalSlides[originalSlides.length - 1];
                    updatePreviousSlideDisplay(previousSlide);
                }
                // Exit transition guard right before resuming hero updates
                isReturningToSlideshow = false;
                showSlide(originalSlides, 0);
                startSlideshow(originalSlides);
            } else {
                // If we somehow have no slides, fall back to org charts
                expandCenterPanel();
            }

            // Refresh data in the background to update lists for the next cycle
            setTimeout(() => { refreshDataBackground(); }, 0);
        }

        // Background data refresh that does NOT interrupt the running slideshow
        async function refreshDataBackground() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.status !== 'success') return;

                const items = json.data;
                
                if (Array.isArray(json.specializations)) {
                    facultySpecializationsList = json.specializations;
                }

                // Update lists on the left/right panels
                renderLists(items);
                renderFacultyOfficers(items);

                // Prepare next-cycle slides but do NOT restart current slideshow
                const eventSlides = items.filter(i => i.type === 'events');
                const grouped = items.filter(i => i.type === 'announcements_group')
                    .flatMap(g => g.announcements || [])
                    .filter(a => !a.file_path);
                const announcementSingles = items.filter(i => i.type === 'announcements');
                const announcementSlides = [...announcementSingles, ...grouped];
                originalSlides = [...eventSlides, ...announcementSlides];
            } catch (_) {
// Silently ignore background refresh errors
            }
        }
        
        // Function to manually refresh marquee (useful for testing or admin purposes)
        function refreshMarquee() {
            console.log('Manually refreshing marquee...');
            // Force refresh by loading new data and updating silently
            loadMarqueeDataSilently().then(newData => {
                if (newData) {
                    updateMarqueeContentSilently(newData);
                }
            });
        }
        
        // Expose refreshMarquee globally for debugging/testing
        window.refreshMarquee = refreshMarquee;
        
        async function loadFreshDataAndRestart() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if(json.status !== 'success') throw new Error('Failed to load fresh data');
                
                const items = json.data;
                
                // Update marquee with fresh news (force update for fresh data)
                if (json.welcome_and_news) {
                    updateMarqueeContentSilently(json.welcome_and_news);
                }
                
                // Update specializations data
                if (json.specializations) {
                    facultySpecializationsList = json.specializations;
                    console.log('Updated specializations data:', facultySpecializationsList.length, 'items');
                }
                
                // Update lists with fresh data
                renderLists(items);
                renderFacultyOfficers(items);
                
                // Prepare fresh slides data using the same interleaving logic
                const mediaItems = items.filter(i => i.file_path);
                const announcementItems = items.filter(i => i.type === 'announcements' && !i.file_path);
                const eventItems = items.filter(i => i.type === 'events' && !i.file_path);
                const groupedAnnouncements = items.filter(i => i.type === 'announcements_group')
                    .flatMap(g => g.announcements || [])
                    .filter(a => !a.file_path);
                
                // Use the same ordering as renderHero: events then announcements
                const freshSlides = [];
                const eventSlides = items.filter(i => i.type === 'events');
                const grouped = items.filter(i => i.type === 'announcements_group')
                    .flatMap(g => g.announcements || [])
                    .filter(a => !a.file_path);
                const announcementSingles = items.filter(i => i.type === 'announcements');
                const announcementSlides = [...announcementSingles, ...grouped];

                freshSlides.push(...eventSlides, ...announcementSlides);

                originalSlides = freshSlides;
                
                console.log('Fresh data loaded - starting new cycle with', originalSlides.length, 'slides');
                
                // Start the slideshow with fresh data
                setTimeout(() => {
                    // Critical cleanup: ensure specializations panels are removed before starting slideshow
                    const specializationsPanel = document.getElementById('specializationsPanel');
                    if (specializationsPanel) {
                        specializationsPanel.remove();
                        console.log('Removed specializations panel before slideshow start');
                    }
                    
                    // Stop any running specializations intervals to prevent overlap
                    stopFacultySlideshow();
                    stopOfficerSlideshow();
                    
                    if (originalSlides.length > 0) {
                        currentSlideIndex = 0;
                        // Reset previous slide to show last slide from array
                        if (originalSlides.length > 1) {
                            previousSlide = originalSlides[originalSlides.length - 1];
                            updatePreviousSlideDisplay(previousSlide);
                        }
                        showSlide(originalSlides, 0);
                        startSlideshow(originalSlides);
                    } else {
                        console.log('No slides available after refresh - expanding to organization charts');
                        expandCenterPanel();
                    }
                }, 800); // Wait for transition to complete
                
            } catch (error) {
                console.error('Error loading fresh data:', error);
                // Fallback to original slides if refresh fails
                if (originalSlides.length > 0) {
                    setTimeout(() => {
                        currentSlideIndex = 0;
                        showSlide(originalSlides, 0);
                        startSlideshow(originalSlides);
                    }, 800);
                }
            }
        }

        function updateSpecializationsPanelPosition() {
            const specializationsPanel = document.getElementById('specializationsPanel');
            if (!specializationsPanel) return;
            
            const centerPanel = document.querySelector('.center');
            const centerRect = centerPanel.getBoundingClientRect();
            const screenRect = document.querySelector('.screen').getBoundingClientRect();
            const gap = 10; // match grid gap
            const pullIn = 8; // move panel slightly left
            const rightPanelLeft = centerRect.right + gap - pullIn;
            const viewportRight = window.innerWidth - gap; // keep a small gutter to the viewport edge
            const containerRight = Math.min(screenRect.right, viewportRight);
            const availableWidth = Math.max(320, containerRight - rightPanelLeft);
            
            specializationsPanel.style.left = `${rightPanelLeft}px`;
            specializationsPanel.style.top = `${centerRect.top}px`;
            specializationsPanel.style.height = `${centerRect.height}px`;

            const screen = document.querySelector('.screen');
            const specializationsPanel = document.createElement('div');
            specializationsPanel.id = 'specializationsPanel';
            specializationsPanel.className = 'panel';
            // Get center panel dimensions for height matching
            const centerPanel = document.querySelector('.center');
            const centerRect = centerPanel.getBoundingClientRect();
            const topbarHeight = document.querySelector('.topbar').getBoundingClientRect().height;
            
            // Calculate position to align with center panel
            const screenRect = document.querySelector('.screen').getBoundingClientRect();
            const gap = 10; // match grid gap
            const pullIn = 8; // move panel slightly left
            const rightPanelLeft = centerRect.right + gap - pullIn; // reduced gap from center panel
            const viewportRight = window.innerWidth - gap; // keep a small gutter to the viewport edge
            const containerRight = Math.min(screenRect.right, viewportRight);
            const availableWidth = Math.max(320, containerRight - rightPanelLeft);
            
            specializationsPanel.style.cssText = `

                left: ${rightPanelLeft}px;
                top: ${centerRect.top}px;
                height: ${centerRect.height}px;
                width: ${availableWidth}px;

                if (marqueeContent && marqueeContent.classList.contains('animate')) {
                    marqueeScrollPosition -= marqueeScrollSpeed;
                    
                    // Reset position when we've scrolled through one complete set of content
                    const contentWidth = marqueeContent.scrollWidth / 2; // Half because content is duplicated
                    if (Math.abs(marqueeScrollPosition) >= contentWidth) {
                        marqueeScrollPosition = 0;
                    }
                    
                    marqueeContent.style.transform = `translateX(${marqueeScrollPosition}px)`;

        // Function to build marquee HTML with duplicated content for seamless loop
        function buildMarqueeHTML(welcomeAndNews) {
            let marqueeText = '';
            
            // Start with welcome message
            if (welcomeAndNews && welcomeAndNews.welcome_message) {
                marqueeText += `<div class="marquee-item">${esc(welcomeAndNews.welcome_message)}</div>`;
            }
            
            // Add news items - with client-side expiration check as additional safety
            if (welcomeAndNews && welcomeAndNews.news && welcomeAndNews.news.length > 0) {
                const now = new Date();
                welcomeAndNews.news.forEach(newsItem => {
                    // Skip expired items (additional client-side check)
                    if (newsItem.expires_at) {
                        const expiresAt = new Date(newsItem.expires_at);
                        if (expiresAt <= now) {
                            console.log('Skipping expired marquee item:', newsItem.title, 'expired at', newsItem.expires_at);
                            return; // Skip this item
                        }
                    }
                    marqueeText += `<span class="marquee-separator">•</span>`;
                    marqueeText += `<div class="marquee-item">${esc(newsItem.title)}: ${esc(newsItem.content)}</div>`;
                });
            }
            
            // If no welcome message and no news, add default content
            if (!welcomeAndNews || 
                (!welcomeAndNews.welcome_message && (!welcomeAndNews.news || welcomeAndNews.news.length === 0))) {
                marqueeText = `<div class="marquee-item">Welcome to Smart Bulletin Board - Your Digital Campus Hub!</div>`;
                marqueeText += `<span class="marquee-separator">•</span>`;
                marqueeText += `<div class="marquee-item">Stay updated with the latest announcements and events</div>`;
                marqueeText += `<span class="marquee-separator">•</span>`;
                marqueeText += `<div class="marquee-item">Check back regularly for important information</div>`;
            } else if (welcomeAndNews.welcome_message && (!welcomeAndNews.news || welcomeAndNews.news.length === 0)) {
                // If only welcome message and no news, add some default content
                marqueeText += `<span class="marquee-separator">•</span>`;
                marqueeText += `<div class="marquee-item">Stay updated with the latest announcements and events</div>`;
                marqueeText += `<span class="marquee-separator">•</span>`;
                marqueeText += `<div class="marquee-item">Check back regularly for important information</div>`;
            }
            
            // Duplicate content for seamless infinite scroll
            return marqueeText + marqueeText;
        }

        // Function to update marquee content silently without stopping animation
        function updateMarqueeContentSilently(newData) {
            const marqueeContent = document.getElementById('marqueeContent');
            if (!marqueeContent) return;
            
            // Only update if content has actually changed
            const newContentHash = createContentHash(newData);
            if (newContentHash === currentMarqueeContentHash) {
                console.log('Marquee content unchanged, skipping silent update');
                return;
            }
            
            console.log('Updating marquee content silently');
            
            // Build new HTML with duplicated content
            const newHTML = buildMarqueeHTML(newData);
            
            // Update content without stopping animation
            marqueeContent.innerHTML = newHTML;
            
            // Reset scroll position for seamless transition
            marqueeScrollPosition = 0;
            marqueeContent.style.transform = `translateX(0px)`;
            
            // Update tracking variables
            currentMarqueeContentHash = newContentHash;
            marqueeCurrentData = newData;
            marqueeLastUpdate = Date.now();
        }

        // Function to initialize marquee with infinite scroll
        function initializeMarquee(welcomeAndNews) {
            const marqueeContainer = document.querySelector('.marquee-container');
            const oldMarqueeContent = document.getElementById('marqueeContent');
            
            console.log('Initializing marquee with infinite scroll');
            
            // Create new marquee content element
            const newMarqueeContent = document.createElement('div');
            newMarqueeContent.className = 'marquee-content transitioning';
            newMarqueeContent.id = 'marqueeContent';
            newMarqueeContent.innerHTML = buildMarqueeHTML(welcomeAndNews);
            
            // Remove old element and add new one
            if (oldMarqueeContent) {
                marqueeContainer.removeChild(oldMarqueeContent);
            }
            marqueeContainer.appendChild(newMarqueeContent);
            
            // Start infinite animation
            requestAnimationFrame(() => {
                newMarqueeContent.classList.add('animate', 'loaded');
                newMarqueeContent.classList.remove('transitioning');
                
                // Track animation state
                marqueeIsAnimating = true;
                marqueeCurrentData = welcomeAndNews;
                currentMarqueeContentHash = createContentHash(welcomeAndNews);
                marqueeLastUpdate = Date.now();
                
                // Start JavaScript-based scroll
                startMarqueeScroll();
                
                console.log('Marquee infinite scroll started');
            });
        }

        // Function to start silent data refresh

            // Clear existing interval

            // Refresh data every 2 minutes silently
            marqueeDataRefreshInterval = setInterval(async () => {
                console.log('Silent marquee data refresh');
                const newData = await loadMarqueeDataSilently();
                if (newData) {
                    updateMarqueeContentSilently(newData);
                }
            }, 120000); // 2 minutes
            
            console.log('Marquee silent data refresh started (every 2 minutes)');
        }

        async function loadData(){
            try {
                // Load display configuration first
                await loadDisplayConfiguration();
                
                const res = await fetch(API_URL);
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                const json = await res.json();
                if(json.status !== 'success') {
                    console.error('API Error:', json);
                    throw new Error(`Failed to load: ${json.message || 'Unknown error'}`);
                }
                const items = json.data;
            
            // Load specializations data if available
            if (json.specializations && json.specializations.length > 0) {
                facultySpecializationsList = json.specializations;
                console.log('Loaded specializations data:', facultySpecializationsList.length, 'items');
            }
            
            // Initialize marquee with infinite scroll (force update on initial load)
            const marqueeData = await loadMarqueeDataSilently();
            if (marqueeData) {
                initializeMarquee(marqueeData);
                startMarqueeDataRefresh();
            }
            
            // Always render hero on first load, or if slideshow has been reset
            // Only auto-refresh the slideshow if we haven't started yet, or if it has completed
            const isInitialLoad = originalSlides.length === 0;
            const hasCompletedSuccessfully = slideshowCompleted;
            
            if (isInitialLoad || hasCompletedSuccessfully) {
                renderHero(items);
            } else {
                // Update originalSlides with fresh data for when we return using interleaving logic
                const mediaItems = items.filter(i => i.file_path);
                const announcementItems = items.filter(i => i.type === 'announcements' && !i.file_path);
                const eventItems = items.filter(i => i.type === 'events' && !i.file_path);
                const groupedAnnouncements = items.filter(i => i.type === 'announcements_group')
                    .flatMap(g => g.announcements || [])
                    .filter(a => !a.file_path);
                
                // Use the same interleaving logic as renderHero
                const freshSlides = [];
                freshSlides.push(...mediaItems);
                
                const allAnnouncements = [...announcementItems, ...groupedAnnouncements];
                const maxLength = Math.max(allAnnouncements.length, eventItems.length);
                
                // Ensure events are always included by prioritizing them
                for (let i = 0; i < maxLength; i++) {
                    // Add event first if available (to ensure events are always visible)
                    if (i < eventItems.length) {
                        freshSlides.push(eventItems[i]);
                    }
                    // Add announcement if available
                    if (i < allAnnouncements.length) {
                        freshSlides.push(allAnnouncements[i]);
                    }
                }
                
                originalSlides = freshSlides;
            }
            renderLists(items);
            renderFacultyOfficers(items);
            } catch (error) {
                console.error('Error loading data:', error);
                // Show error message to user
                const heroSection = document.querySelector('.hero-section');
                if (heroSection) {
                    heroSection.innerHTML = `
                        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; text-align: center; padding: 2rem;">
                            <h2 style="font-size: 2rem; margin-bottom: 1rem;">⚠️ Unable to Load Data</h2>
                            <p style="font-size: 1.2rem; margin-bottom: 1rem;">${error.message}</p>
                            <p style="font-size: 1rem; opacity: 0.8;">Please check the console for more details or contact the administrator.</p>
                        </div>
                    `;
                }
            }
        }

        loadData();
        // Reduced auto-reload interval to give slideshow more time, but only refresh after completion
        setInterval(loadData, 300000); // 5 minutes instead of 1 minute

        // Theme Management System
        let currentTheme = '';
        let themeCheckInterval = null;
        let themeCSSLink = null;

        function loadThemeCSS(themeName) {
            // Remove existing theme CSS
            if (themeCSSLink) {
                themeCSSLink.remove();
                themeCSSLink = null;
            }
            
            // Load new theme CSS if theme is not default
            if (themeName && themeName !== '') {
                themeCSSLink = document.createElement('link');
                themeCSSLink.rel = 'stylesheet';
                themeCSSLink.href = `../css/themes/${themeName.replace('theme-', '')}.css`;
                themeCSSLink.id = 'theme-css';
                document.head.appendChild(themeCSSLink);
                console.log('Loaded theme CSS:', themeCSSLink.href);
            }
        }

        async function loadTheme() {
            try {
                // Get theme parameter from URL if it exists
                const urlParams = new URLSearchParams(window.location.search);
                const themeParam = urlParams.get('theme');
                
                // Build API URL with theme parameter if present
                let apiUrl = '../api/get_theme.php';
                if (themeParam) {
                    apiUrl += '?theme=' + encodeURIComponent(themeParam);
                }
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const newTheme = data.theme_class || '';
                    
                    // Only apply theme if it has changed
                    if (newTheme !== currentTheme) {
                        console.log('Theme changed from', currentTheme, 'to', newTheme);
                        
                        // Remove old theme class
                        if (currentTheme) {
                            document.body.classList.remove(currentTheme);
                        }
                        
                        // Apply new theme class
                        if (newTheme) {
                            document.body.classList.add(newTheme);
                        }
                        
                        // Load/unload theme CSS
                        loadThemeCSS(newTheme);
                        
                        currentTheme = newTheme;
                        
                        // Log theme application
                        if (newTheme) {
                            console.log('Applied theme:', newTheme);
                        } else {
                            console.log('Applied default theme (no theme class)');
                        }
                    }
                } else {
                    console.warn('Failed to load theme:', data.message);
                }
            } catch (error) {
                console.error('Error loading theme:', error);
            }
        }

        // Load theme on page load
        loadTheme();

        // Check for theme changes every 5 minutes
        themeCheckInterval = setInterval(loadTheme, 300000);

        // Manual theme override function (for testing)
        async function setThemeOverride(themeName) {
            try {
                // Build API URL with theme parameter
                let apiUrl = '../api/get_theme.php';
                if (themeName) {
                    apiUrl += '?theme=' + encodeURIComponent(themeName);
                }
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const newTheme = data.theme_class || '';
                    
                    // Remove old theme class
                    if (currentTheme) {
                        document.body.classList.remove(currentTheme);
                    }
                    
                    // Apply new theme class
                    if (newTheme) {
                        document.body.classList.add(newTheme);
                    }
                    
                    // Load/unload theme CSS
                    loadThemeCSS(newTheme);
                    
                    currentTheme = newTheme;
                    
                    // Log theme application
                    if (newTheme) {
                        console.log('Applied theme override:', newTheme);
                    } else {
                        console.log('Applied default theme (override)');
                    }
                } else {
                    console.warn('Failed to apply theme override:', data.message);
                }
            } catch (error) {
                console.error('Error applying theme override:', error);
            }
        }

        // Expose theme functions globally for debugging/testing
        window.setThemeOverride = setThemeOverride;
        window.loadTheme = loadTheme;
        window.getCurrentTheme = () => currentTheme;
        
        // Update specializations panel position on resize and zoom
        window.addEventListener('resize', updateSpecializationsPanelPosition);
        
        // Handle marquee resize events - simplified for infinite scroll
        window.addEventListener('resize', () => {
            const marqueeContent = document.getElementById('marqueeContent');
            if (marqueeContent && marqueeContent.classList.contains('animate')) {
                // Infinite scroll doesn't need duration recalculation
                console.log('Marquee resize: Maintaining infinite scroll animation');
            }
        });
        
        // Update specializations panel position when center panel changes
        const centerPanel = document.querySelector('.center');
        if (centerPanel) {
            const observer = new MutationObserver(() => {
                setTimeout(updateSpecializationsPanelPosition, 50);
            });
            observer.observe(centerPanel, { 
                attributes: true, 
                attributeFilter: ['class', 'style'],
                childList: true,
                subtree: true
            });
        }
    </script>
</body>
</html>
